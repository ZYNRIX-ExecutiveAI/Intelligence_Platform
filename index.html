        el("span", { html: iconHtml("info"), style: "width:14px;height:14px;flex:0 0 auto;margin-top:1px;" }),
        SHARED_DEVICE_WARNING
      )
    ));
    function handleFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const result = parseProgressFile(ev.target.result, file.size);
        if (!result.ok) {
          const messages = {
            "file-too-large": "That file is too large to be a ZYNRIX progress file",
            "invalid-json": "That file isn't valid JSON",
            "invalid-shape": "That file's contents don't match the expected shape",
            "unrecognized-format": "That doesn't look like a ZYNRIX progress file"
          };
          toast(messages[result.reason] || "That doesn't look like a ZYNRIX progress file", "plain");
          uploadInput.value = "";
          return;
        }
        confirmImport(result, () => {
          uploadInput.value = "";
        });
      };
      reader.readAsText(file);
    }
    function summaryRow(label, value) {
      return el(
        "div",
        { class: "import-summary__row" },
        el("span", { class: "import-summary__label" }, label),
        el("span", { class: "import-summary__value" }, value)
      );
    }
    function confirmImport(result, onDone) {
      const s = result.summary;
      const summaryNode = s ? el(
        "div",
        { class: "import-summary" },
        summaryRow("Organization profile", s.hasOrganizationProfile ? "Present" : "Not set"),
        summaryRow("Assessment", s.assessmentStatus === "complete" ? "Complete" : s.assessmentStatus === "in_progress" ? "In progress" : "Not started"),
        summaryRow("Responses", String(s.responseCount) + " of 30"),
        summaryRow("Evidence notes", String(s.evidenceNoteCount)),
        summaryRow("Favorited prompts", String(s.favoriteCount)),
        summaryRow("Saved prompts", String(s.savedPromptCount))
      ) : el("p", { style: "font-size:12px;color:var(--zx-silver-mid);margin:0 0 16px;" }, "This is an older backup file format \u2014 a detailed summary isn't available before import, but the same validation still applies.");
      const modal = openModal({
        titleId: "import-confirm-title",
        titleNode: el("h2", { id: "import-confirm-title", class: "card-title" }, "Import this backup?"),
        bodyNodes: [
          el("p", { style: "font-size:13.5px;color:var(--zx-silver);line-height:1.6;margin:0 0 16px;" }, BACKUP_IMPORT_WARNING),
          summaryNode,
          el(
            "div",
            { class: "btn-row", style: "margin-top:20px;" },
            Button({ variant: "secondary", onclick: () => {
              modal.close();
              onDone();
            } }, "Cancel"),
            Button(
              { onclick: () => {
                modal.close();
                applyImport(result);
                onDone();
              } },
              el("span", { html: iconHtml("upload") }),
              "Replace current data"
            )
          )
        ]
      });
    }
    function applyImport(result) {
      setState(Object.assign(freshState(), result.runtimeState));
      saveToStorage(getState());
      if (result.droppedCount > 0) {
        toast(`Progress restored \u2014 ${result.droppedCount} invalid entr${result.droppedCount === 1 ? "y" : "ies"} in that file ${result.droppedCount === 1 ? "was" : "were"} skipped`, "plain");
      } else {
        toast("Progress restored");
      }
      window.ZXRouter.go("dashboard");
    }
    function confirmExport(e) {
      const triggerEl = e && e.currentTarget;
      const modal = openModal({
        titleId: "export-confirm-title",
        titleNode: el("h2", { id: "export-confirm-title", class: "card-title" }, "Download backup file?"),
        triggerEl,
        bodyNodes: [
          el("p", { style: "font-size:13.5px;color:var(--zx-silver);line-height:1.6;margin:0 0 20px;" }, BACKUP_EXPORT_WARNING),
          el(
            "div",
            { class: "btn-row" },
            Button({ variant: "secondary", onclick: () => modal.close() }, "Cancel"),
            Button(
              { onclick: () => {
                modal.close();
                downloadProgress(getState());
                toast("Progress file downloaded");
              } },
              el("span", { html: iconHtml("download") }),
              "Download"
            )
          )
        ]
      });
    }
    function confirmReset(e) {
      const triggerEl = e && e.currentTarget;
      const modal = openModal({
        titleId: "reset-confirm-title",
        titleNode: el("h2", { id: "reset-confirm-title", class: "card-title" }, "Reset everything?"),
        triggerEl,
        bodyNodes: [
          el("p", { style: "font-size:13.5px;color:var(--zx-silver);line-height:1.6;margin:0 0 12px;" }, "This permanently deletes:"),
          el(
            "ul",
            { style: "margin:0 0 20px;padding-left:20px;font-size:13px;color:var(--zx-silver);line-height:1.7;" },
            ...RESET_DATA_CATEGORIES.map((cat) => el("li", {}, cat))
          ),
          el("p", { style: "font-size:12px;color:var(--zx-warn);margin:0 0 20px;" }, "This cannot be undone."),
          el(
            "div",
            { class: "btn-row" },
            Button({ variant: "secondary", onclick: () => modal.close() }, "Cancel"),
            Button(
              { variant: "danger", onclick: () => {
                modal.close();
                doReset();
              } },
              el("span", { html: iconHtml("trash") }),
              "Reset Everything"
            )
          )
        ]
      });
    }
    function doReset() {
      resetState();
      toast("Everything reset");
      window.ZXRouter.go("onboarding");
    }
  }

  // src/router/router.js
  var RENDERERS = {
    onboarding: OnboardingScreen,
    assessment: AssessmentScreen,
    dashboard: DashboardScreen,
    recommendations: RecommendationsScreen,
    library: PromptLibraryScreen,
    builder: PromptBuilderScreen,
    export: ExportScreen,
    save: SaveScreen,
    professional: ProfessionalEditionScreen
  };
  function render(opts) {
    const replaceHistory = !!(opts && opts.replaceHistory);
    const main = $("#main");
    main.innerHTML = "";
    const screenEl = el("div", { class: "screen active" });
    main.appendChild(screenEl);
    const key = getState().screen;
    const fn = RENDERERS[key];
    if (fn) fn(screenEl);
    buildRail();
    buildMobileStepper();
    try {
      if (replaceHistory && window.history && typeof window.history.replaceState === "function") {
        window.history.replaceState(null, "", "#" + key);
      } else {
        location.hash = key;
      }
    } catch (e) {
    }
  }
  function focusMainHeading() {
    const heading = $("#main h1");
    if (!heading) return;
    if (!heading.hasAttribute("tabindex")) heading.setAttribute("tabindex", "-1");
    heading.focus({ preventScroll: true });
  }
  function go(screenKey) {
    if (!SCREEN_META[screenKey]) return;
    const state = getState();
    const access = canAccessModule(screenKey, state);
    const redirected = !access.allowed;
    const targetKey = redirected ? access.fallback || "onboarding" : screenKey;
    state.screen = targetKey;
    persist();
    render({ replaceHistory: redirected });
    const main = $("#main");
    if (main) main.scrollTop = 0;
    window.scrollTo(0, 0);
    focusMainHeading();
    if (redirected) toast(ASSESSMENT_GATE_TOAST, "plain");
  }

  // src/components/RecoveryModal.js
  function openRecoveryModal(corruptedRaw) {
    const modal = openModal({
      titleId: "recovery-modal-title",
      titleNode: el("h2", { id: "recovery-modal-title", class: "card-title" }, "Recovery Needed"),
      bodyNodes: [
        el(
          "p",
          { style: "font-size:13.5px;color:var(--zx-white);line-height:1.65;margin:0 0 16px;" },
          "Your locally saved data could not be fully loaded. A recovery copy has been preserved."
        ),
        el(
          "p",
          { style: "font-size:12.5px;color:var(--zx-silver-mid);line-height:1.6;margin:0 0 20px;" },
          "You're currently on a fresh, empty session. Exporting the recovery file keeps a copy of the raw saved data exactly as it was found, in case it's useful later \u2014 it may not be usable data, since something about it prevented loading."
        ),
        el(
          "div",
          { class: "btn-row", style: "flex-wrap:wrap;gap:10px;" },
          Button({ variant: "secondary", onclick: () => {
            downloadRecoveryFile(corruptedRaw);
            toast("Recovery file downloaded");
          } }, "Export recovery file"),
          Button({ variant: "danger", onclick: () => {
            clearRecoveryData();
            resetState();
            clearCorruptedRecoveryFlag();
            modal.close();
            toast("Starting clean");
          } }, "Start clean"),
          Button({ variant: "secondary", onclick: () => {
            clearCorruptedRecoveryFlag();
            modal.close();
          } }, "Cancel")
        )
      ]
    });
    return modal;
  }

  // src/main.js
  window.ZXRouter = { go, render };
  function init() {
    buildShell();
    const hash = (location.hash || "").replace("#", "");
    let redirected = false;
    if (hash && SCREEN_META[hash]) {
      const access = canAccessModule(hash, getState());
      if (access.allowed) {
        getState().screen = hash;
      } else {
        getState().screen = access.fallback || "onboarding";
        redirected = true;
      }
    }
    render({ replaceHistory: redirected });
    if (redirected) toast(ASSESSMENT_GATE_TOAST, "plain");
    const corruptedRaw = getCorruptedRecovery();
    if (corruptedRaw) openRecoveryModal(corruptedRaw);
    window.addEventListener("hashchange", () => {
      const key = (location.hash || "").replace("#", "");
      if (SCREEN_META[key] && getState().screen !== key) {
        const access = canAccessModule(key, getState());
        const wasRedirected = !access.allowed;
        getState().screen = wasRedirected ? access.fallback || "onboarding" : key;
        render({ replaceHistory: wasRedirected });
        focusMainHeading();
        if (wasRedirected) toast(ASSESSMENT_GATE_TOAST, "plain");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
